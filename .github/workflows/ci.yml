name: JNSD School ERP - CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    name: Lint, Test and Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Production Web Build
        run: npm run build

      - name: Execute Vitest Test Suite
        run: npm test

      - name: Verify Capacitor Sync
        run: npx cap sync android

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jnsd-web-dist
          path: dist/
          retention-days: 14

