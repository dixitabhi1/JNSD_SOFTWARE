name: JNSD School ERP - Android Release & GitHub Publication

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-apk:
    name: Build Signed Android APK & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Revision
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Run Test Verification Gate
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease
          ./gradlew assembleDebug

      - name: Generate Checksum
        run: |
          cd android/app/build/outputs/apk/release/
          sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256 || true
          cd ../debug/
          sha256sum app-debug.apk > app-debug.apk.sha256 || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: JNSD School ERP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            public/version-manifest.json

