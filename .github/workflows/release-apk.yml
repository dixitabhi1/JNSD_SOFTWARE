name: JNSD School ERP - Android Release & GitHub Publication

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release-apk:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Revision
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Run Test Verification Gate
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Collect & Checksum Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-v1.1.0}"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/JNSD_School_ERP_${TAG_NAME}_debug.apk"
            sha256sum "release-artifacts/JNSD_School_ERP_${TAG_NAME}_debug.apk" > "release-artifacts/JNSD_School_ERP_${TAG_NAME}_debug.apk.sha256"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-artifacts/JNSD_School_ERP_${TAG_NAME}_release_unsigned.apk"
            sha256sum "release-artifacts/JNSD_School_ERP_${TAG_NAME}_release_unsigned.apk" > "release-artifacts/JNSD_School_ERP_${TAG_NAME}_release_unsigned.apk.sha256"
          fi
          if [ -f public/version-manifest.json ]; then
            cp public/version-manifest.json release-artifacts/
          fi
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: JNSD School ERP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifacts
          path: release-artifacts/*
